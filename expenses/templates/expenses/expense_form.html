{% extends 'expenses/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Expense</h2>

<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'expenses:expense-list' %}" class="btn btn-secondary">Cancel</a>
</form>

{% if show_actions %}
<div class="mt-4">
    <a href="{% url 'expenses:expense-add' %}" class="btn btn-success">Add Another Expense</a>
    <a href="{% url 'expenses:income-add' %}" class="btn btn-info">Add Income</a>
    <a href="{% url 'expenses:dashboard' %}" class="btn btn-primary">Go Home</a>
</div>
{% endif %}
{% endblock %}
